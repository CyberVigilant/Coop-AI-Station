<style>
  .major-label:hover { background: rgba(0, 119, 255, .05); }
  .major-label input[type="checkbox"] { cursor: pointer; }
</style>

<form method="get" action="{% url 'opportunities' %}" id="majorsForm">
  {% if selected_region %}<input type="hidden" name="region" value="{{ selected_region }}">{% endif %}
  {% if selected_city %}<input type="hidden" name="city" value="{{ selected_city }}">{% endif %}
  {% if selected_status %}<input type="hidden" name="status" value="{{ selected_status }}">{% endif %}

  <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
    <span class="fw-bold" style="font-size:.875rem;">Filter by Major</span>
    <a href="{{ clear_majors_url }}" class="text-brand text-decoration-none fw-semibold" style="font-size:.8rem;">Clear all</a>
  </div>

  <div style="max-height:340px; overflow-y:auto;">
    {% if categories_ui %}
    <div style="display:grid; grid-template-columns:1fr 1fr;">
      {% for c in categories_ui %}
      <label class="major-label d-flex align-items-center gap-2 px-3 py-2 m-0"
          style="cursor:pointer; font-size:.875rem; user-select:none; border-bottom:1px solid rgba(17,17,17,.04);">
        <input class="form-check-input m-0 flex-shrink-0" type="checkbox"
            name="category" value="{{ c.id }}" {% if c.selected %}checked{% endif %}>
        <span class="flex-grow-1" style="line-height:1.3;">{{ c.name }}</span>
        {% if c.count %}
        <span class="fw-bold flex-shrink-0" style="font-size:.72rem; color:var(--brand-blue);">{{ c.count }}</span>
        {% endif %}
      </label>
      {% endfor %}
    </div>
    {% else %}
    <div class="px-3 py-4 text-secondary small">No categories found.</div>
    {% endif %}
  </div>

</form>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var form = document.getElementById("majorsForm");
    if (!form) return;
    form.querySelectorAll("input[type='checkbox'][name='category']").forEach(function (cb) {
      cb.addEventListener("change", function () { form.submit(); });
    });
  });
</script>
